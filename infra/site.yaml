AWSTemplateFormatVersion: '2010-09-09'
Description: TerraPlan static site - S3 + CloudFront + ACM + Route53, deployed by GitHub Actions via OIDC

Parameters:
  ZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route 53 hosted zone id for the domain
  Domain:
    Type: String
    Description: Apex domain, e.g. terraplan.build
    MinLength: 1
  GithubIdentityProvider:
    Type: String
    Description: ARN of the existing GitHub OIDC provider
  GithubOrgName:
    Type: String
    MinLength: 1
  GithubRepositoryName:
    Type: String
    MinLength: 1
  GithubOrgId:
    Type: String
    Description: Numeric GitHub id of the owning user or org (gh api users/<owner> --jq .id)
    AllowedPattern: '[0-9]+'
  GithubRepositoryId:
    Type: String
    Description: Numeric GitHub id of the repo (gh api repos/<org>/<repo> --jq .id)
    AllowedPattern: '[0-9]+'

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  BucketReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    DependsOn: [Bucket]
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - s3:Get*
              - s3:List*
            Resource:
              - !GetAtt Bucket.Arn
              - !Join ["/", [!GetAtt Bucket.Arn, "*"]]

  BucketWritePolicy:
    Type: AWS::IAM::ManagedPolicy
    DependsOn: [Bucket]
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - s3:Put*
              - s3:Delete*
            Resource:
              - !Join ["/", [!GetAtt Bucket.Arn, "*"]]

  SslCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref Domain
      SubjectAlternativeNames:
        - !Sub "www.${Domain}"
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref Domain
          HostedZoneId: !Ref ZoneId
        - DomainName: !Sub "www.${Domain}"
          HostedZoneId: !Ref ZoneId

  # Canonicalises to the apex domain and maps clean URLs onto index.html
  CloudFrontRequestModifyFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "RequestModify-${AWS::StackName}"
      AutoPublish: true
      FunctionConfig:
        Comment: Redirect www to apex, strip trailing slash, resolve directory index
        Runtime: cloudfront-js-1.0
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          var host = request.headers.host.value;
          var uri = request.uri;

          // www -> apex (301, permanent: this is the canonical host)
          if (host.startsWith("www.")) {
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: {"location": {"value": "https://${Domain}" + uri}}
            };
          }

          // strip a trailing slash so /about/ and /about do not split cache or SEO
          if (uri.length > 1 && uri.endsWith('/')) {
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: {"location": {"value": "https://" + host + uri.slice(0, -1)}}
            };
          }

          // extensionless path -> its index.html in S3
          if (!uri.includes('.')) {
            request.uri = uri + '/index.html';
          }

          if (request.uri.startsWith('//')) {
            request.uri = request.uri.slice(1);
          }

          return request;
        }

  CloudFrontOriginAccessIdentity:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Sub "OriginAccessIdentity for ${AWS::StackName}"

  CloudFrontS3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    DependsOn: [Bucket, CloudFrontOriginAccessIdentity]
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Action: s3:GetObject
            Effect: Allow
            Resource: !Sub '${Bucket.Arn}/*'
            Principal:
              CanonicalUser: !GetAtt CloudFrontOriginAccessIdentity.S3CanonicalUserId

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    DependsOn:
      - Bucket
      - SslCertificate
      - CloudFrontOriginAccessIdentity
      - CloudFrontRequestModifyFunction
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "TerraPlan site - ${Domain}"
        Aliases:
          - !Ref Domain
          - !Sub "www.${Domain}"
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref SslCertificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: S3
            DomainName: !GetAtt Bucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: !Sub "origin-access-identity/cloudfront/${CloudFrontOriginAccessIdentity}"
        DefaultRootObject: index.html
        DefaultCacheBehavior:
          TargetOriginId: S3
          Compress: true
          AllowedMethods: [GET, HEAD]
          ViewerProtocolPolicy: redirect-to-https
          # AWS managed policy: CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !Ref CloudFrontRequestModifyFunction
        CustomErrorResponses:
          - ErrorCachingMinTTL: 10
            ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
          - ErrorCachingMinTTL: 10
            ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html

  Route53RecordSetGroup:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref ZoneId
      RecordSets:
        - Name: !Ref Domain
          Type: A
          AliasTarget:
            DNSName: !GetAtt CloudFrontDistribution.DomainName
            EvaluateTargetHealth: false
            HostedZoneId: 'Z2FDTNDATAQYW2'   # fixed zone id for all CloudFront aliases
        - Name: !Ref Domain
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt CloudFrontDistribution.DomainName
            EvaluateTargetHealth: false
            HostedZoneId: 'Z2FDTNDATAQYW2'
        - Name: !Sub 'www.${Domain}'
          Type: A
          AliasTarget:
            DNSName: !GetAtt CloudFrontDistribution.DomainName
            EvaluateTargetHealth: false
            HostedZoneId: 'Z2FDTNDATAQYW2'
        - Name: !Sub 'www.${Domain}'
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt CloudFrontDistribution.DomainName
            EvaluateTargetHealth: false
            HostedZoneId: 'Z2FDTNDATAQYW2'

  GithubRole:
    Type: AWS::IAM::Role
    DependsOn: [BucketReadPolicy, BucketWritePolicy, CloudFrontDistribution]
    Properties:
      ManagedPolicyArns:
        - !Ref BucketReadPolicy
        - !Ref BucketWritePolicy
      Policies:
        - PolicyName: ListCloudFormationOutput
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Ref AWS::StackId
        - PolicyName: FlushCloudFront
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  # lets the workflow wait for the invalidation to finish
                  - cloudfront:GetInvalidation
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRoleWithWebIdentity
            Principal:
              Federated: !Ref GithubIdentityProvider
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # limits this role to one repo in GitHub. GitHub now issues
                # subjects that embed the owner and repo ids
                # (repo:org@123/repo@456:...); the plain form is kept for
                # tokens that still use it.
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GithubOrgName}/${GithubRepositoryName}:*
                  - !Sub repo:${GithubOrgName}@${GithubOrgId}/${GithubRepositoryName}@${GithubRepositoryId}:*

Outputs:
  BucketName:
    Value: !Ref Bucket
    Export: {Name: !Sub '${AWS::StackName}-BucketName'}
  DistributionId:
    Value: !Ref CloudFrontDistribution
    Export: {Name: !Sub '${AWS::StackName}-DistributionId'}
  GithubRole:
    Value: !GetAtt GithubRole.Arn
    Export: {Name: !Sub '${AWS::StackName}-GithubRole'}
  SiteUrl:
    Value: !Sub 'https://${Domain}'
